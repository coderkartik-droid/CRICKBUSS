{% extends 'base.html' %}

{% block title %}403 - Access Forbidden | CrickScore Live{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="content-card p-5 shadow-lg border-0 rounded-4">
        <div class="empty-state-icon mx-auto bg-danger bg-opacity-10 text-danger mb-4" style="width: 88px; height: 88px; font-size: 2.2rem;">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="display-4 fw-bold text-main mb-2">403</h1>
        <h4 class="fw-bold mb-3">Members Pavilion Only!</h4>
        <p class="text-muted small mb-4">
          You do not possess the required staff or administrative clearance to access this portal or resource.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <a href="{% url 'home' %}" class="btn btn-emerald rounded-pill px-4">
            <i class="fa-solid fa-house me-1"></i> Back to Home
          </a>
          <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Switch Account
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
