{% extends 'base.html' %}

{% block title %}500 - Server Overhaul | CrickScore Live{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="content-card p-5 shadow-lg border-0 rounded-4">
        <div class="empty-state-icon mx-auto bg-danger bg-opacity-10 text-danger mb-4" style="width: 88px; height: 88px; font-size: 2.2rem;">
          <i class="fa-solid fa-cloud-bolt"></i>
        </div>
        <h1 class="display-4 fw-bold text-main mb-2">500</h1>
        <h4 class="fw-bold mb-3">Rain Stopped Play!</h4>
        <p class="text-muted small mb-4">
          Our servers encountered an unexpected technical boundary. The ground staff has been deployed to fix this immediately.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <a href="{% url 'home' %}" class="btn btn-emerald rounded-pill px-4">
            <i class="fa-solid fa-house me-1"></i> Back to Home
          </a>
          <button onclick="window.location.reload();" class="btn btn-outline-secondary rounded-pill px-4">
            <i class="fa-solid fa-rotate-right me-1"></i> Retry
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
