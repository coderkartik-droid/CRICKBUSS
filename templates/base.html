<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CRICKBUSS - Premium Cricket Scores, Live Matches & Sports News{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Get local cricket scores, ball by ball commentary, match schedules, points tables, player stats, and local cricket news.{% endblock %}">

  <!-- Canonical & SEO -->
  <link rel="canonical" href="{% block canonical %}{{ request.build_absolute_uri }}{% endblock %}">

  <!-- OpenGraph Meta -->
  <meta property="og:site_name" content="CRICKBUSS">
  <meta property="og:title" content="{% block og_title %}CRICKBUSS - Premium Cricket Scores, Live Matches & Sports News{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Fastest live cricket scores, ball by ball commentary, team statistics, and tournament schedules.{% endblock %}">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta property="og:image" content="{% block og_image %}https://images.unsplash.com/photo-1531415074968-036ba1b575da?w=1200&q=80{% endblock %}">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}CRICKBUSS - Premium Cricket Scores{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Fastest live scores, ball by ball commentary, team stats, and tournament schedules.{% endblock %}">
  <meta name="twitter:image" content="{% block twitter_image %}https://images.unsplash.com/photo-1531415074968-036ba1b575da?w=1200&q=80{% endblock %}">

  <!-- Structured Data JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "CRICKBUSS",
    "url": "{{ request.scheme }}://{{ request.get_host }}/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "{{ request.scheme }}://{{ request.get_host }}/search/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Theme Stylesheets -->
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dark-mode.css">

  {% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Global Navigation Header -->
  {% include 'navbar.html' %}

  <!-- Django Messages Alert Banner -->
  <div class="container mt-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert" data-server-toast="{{ message|escape }}" data-toast-type="{{ message.tags|default:'info' }}">
          <i class="fa-solid fa-circle-info me-2"></i> {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
  </div>

  <!-- Dynamic Toast Container (Top Right) -->
  <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;"></div>

  <!-- Main Content Block -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  {% include 'footer.html' %}

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <!-- Core JavaScript Assets -->
  <script src="/static/js/dark-mode.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/live-score.js"></script>
  <script src="/static/js/charts.js"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
